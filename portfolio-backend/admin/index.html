<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">
    <div id="app" class="container mx-auto p-4">
        <!-- Render App content -->
    </div>

    <script>
        const app = document.getElementById('app');
        const API_URL = 'http://127.0.0.1:8000'; // Or relative link if served from same origin
        let token = localStorage.getItem('access_token');

        // State
        let currentPage = 'personal';

        // --- Render Functions ---

        function renderLogin() {
            app.innerHTML = `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
                        <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
                        <form id="loginForm">
                            <div class="mb-4">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                                <input type="text" id="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                            </div>
                            <div class="mb-6">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                                <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                            </div>
                            <div class="flex items-center justify-between">
                                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                                    Sign In
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await login(document.getElementById('username').value, document.getElementById('password').value);
            });
        }

        function renderDashboard() {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col">
                    <header class="bg-white shadow">
                        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 class="text-xl font-bold">Portfolio Admin</h1>
                            <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium">Logout</button>
                        </div>
                    </header>
                    <div class="flex-1 flex overflow-hidden mt-4">
                        <aside class="w-64 bg-white shadow-md rounded mr-4 hidden md:block">
                            <nav class="mt-4">
                                <a href="#" onclick="changePage('personal')" class="${currentPage === 'personal' ? 'bg-blue-100 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} block py-2 px-4 rounded transition">Personal Details</a>
                                <a href="#" onclick="changePage('technologies')" class="${currentPage === 'technologies' ? 'bg-blue-100 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} block py-2 px-4 rounded transition">Technologies</a>
                                <a href="#" onclick="changePage('projects')" class="${currentPage === 'projects' ? 'bg-blue-100 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} block py-2 px-4 rounded transition">Projects</a>
                                <a href="#" onclick="changePage('education')" class="${currentPage === 'education' ? 'bg-blue-100 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} block py-2 px-4 rounded transition">Education</a>
                                <a href="#" onclick="changePage('contact')" class="${currentPage === 'contact' ? 'bg-blue-100 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} block py-2 px-4 rounded transition">Messages</a>
                            </nav>
                        </aside>
                        <main class="flex-1 bg-white shadow-md rounded p-6 overflow-y-auto">
                            <div id="content">Loading...</div>
                        </main>
                    </div>
                </div>
            `;
            loadPageContent(currentPage);
        }

        // --- Logic ---

        async function login(username, password) {
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Login failed');

                const data = await response.json();
                token = data.access_token;
                localStorage.setItem('access_token', token);
                renderDashboard();
            } catch (error) {
                alert('Invalid credentials');
                console.error(error);
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            token = null;
            renderLogin();
        }

        function changePage(page) {
            currentPage = page;
            renderDashboard(); // Re-render to update active tab state
        }

        async function authenticatedFetch(endpoint, options = {}) {
            if (!options.headers) options.headers = {};
            options.headers['Authorization'] = `Bearer ${token}`;

            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) {
                logout();
                throw new Error('Unauthorized');
            }
            return response;
        }

        async function loadPageContent(page) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="text-center py-10">Loading...</div>';

            try {
                if (page === 'personal') {
                    await renderPersonalDetails(contentDiv);
                } else if (page === 'technologies') {
                    await renderTechnologies(contentDiv);
                } else if (page === 'projects') {
                    await renderProjects(contentDiv);
                } else if (page === 'education') {
                    await renderEducation(contentDiv);
                } else if (page === 'contact') {
                    await renderContacts(contentDiv);
                }
            } catch (error) {
                contentDiv.innerHTML = `<div class="text-red-500">Error loading content: ${error.message}</div>`;
            }
        }

        // --- Page Specific Logic ---
        async function renderPersonalDetails(container) {
            const response = await authenticatedFetch('/api/me');
            if (response.status === 404) {
                // Form to create
                renderPersonalForm(container, {});
                return;
            }
            const data = await response.json();
            renderPersonalForm(container, data);
        }

        function renderPersonalForm(container, data) {
            container.innerHTML = `
                <h2 class="text-2xl font-bold mb-4">Personal Details</h2>
                <form id="personalForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium">Email</label><input type="email" name="email" value="${data.email || ''}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></div>
                        <div><label class="block text-sm font-medium">Contact</label><input type="text" name="contact" value="${data.contact || ''}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></div>
                        <div><label class="block text-sm font-medium">Tag Line</label><input type="text" name="tag_line" value="${data.tag_line || ''}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></div>
                        <div><label class="block text-sm font-medium">Address</label><input type="text" name="address" value="${data.address || ''}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></div>
                        <div class="col-span-full"><label class="block text-sm font-medium">Bio</label><textarea name="bio" rows="4" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">${data.bio || ''}</textarea></div>
                        <div><label class="block text-sm font-medium">GitHub</label><input type="text" name="github" value="${data.github || ''}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></div>
                        <div><label class="block text-sm font-medium">LinkedIn</label><input type="text" name="linkedin" value="${data.linkedin || ''}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></div>
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700">Save Changes</button>
                </form>
            `;
            document.getElementById('personalForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const payload = Object.fromEntries(formData.entries());

                const res = await authenticatedFetch('/api/me', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) alert('Updated successfully!');
                else alert('Failed to update');
            });
        }

        async function renderTechnologies(container) {
            const res = await authenticatedFetch('/api/technologies');
            const data = await res.json();

            container.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Technologies</h2>
                    <button onclick="showTechModal()" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">+ Add New</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${data.map(tech => `
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                        <button onclick="moveTech(${tech.id}, 'up')" class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">↑</button>
                                        <button onclick="moveTech(${tech.id}, 'down')" class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">↓</button>
                                        </td>
                                    <td class="px-6 py-4 whitespace-nowrap">${tech.technology}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">${tech.category}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <button onclick='editTech(${JSON.stringify(tech)})' class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">Edit</button>
                                        <button onclick="deleteTech(${tech.id})" class="text-white bg-red-600 hover:bg-red-700 px-2 py-1 rounded">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <!-- Modal for Add/Edit Tech -->
                <div id="techModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center">
                    <div class="bg-white p-6 rounded shadow-lg w-96">
                        <h3 id="techModalTitle" class="text-lg font-bold mb-4">Add Technology</h3>
                        <form id="techForm">
                            <input type="hidden" name="id">
                            <div class="mb-4">
                                <label class="block text-sm font-medium">Name</label>
                                <input type="text" name="technology" required class="w-full border p-2 rounded">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium">Category</label>
                                <select name="category" required class="w-full border p-2 rounded">
                                    <option value="Language">Language</option>
                                    <option value="Framework/Library">Framework/Library</option>
                                    <option value="Dev Tool">Dev Tool</option>
                                    <option value="Database">Database</option>
                                </select>
                            </div>
                            <div class="flex justify-end space-x-2">
                                <button type="button" onclick="document.getElementById('techModal').classList.add('hidden')" class="px-4 py-2 border rounded">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('techForm').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const payload = Object.fromEntries(formData.entries());
                const id = formData.get('id');

                const url = id ? `/api/technologies/${id}` : '/api/technologies';
                const method = id ? 'PUT' : 'POST';

                await authenticatedFetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('techModal').classList.add('hidden');
                renderTechnologies(container);
            }
        }

        window.showTechModal = () => {
            document.getElementById('techModalTitle').innerText = "Add Technology";
            document.getElementById('techForm').reset();
            document.querySelector('#techForm [name=id]').value = "";
            document.getElementById('techModal').classList.remove('hidden');
        };

        window.editTech = (tech) => {
            document.getElementById('techModalTitle').innerText = "Edit Technology";
            const form = document.getElementById('techForm');
            form.querySelector('[name=id]').value = tech.id;
            form.querySelector('[name=technology]').value = tech.technology;
            form.querySelector('[name=category]').value = tech.category;
            document.getElementById('techModal').classList.remove('hidden');
        };

        window.deleteTech = async (id) => {
            if (!confirm('Are you sure?')) return;
            await authenticatedFetch(`/api/technologies/${id}`, { method: 'DELETE' });
            renderTechnologies(document.getElementById('content'));
        }

        window.moveTech = async (id, direction) => {
            await authenticatedFetch(`/api/technologies/${id}/move?direction=${direction}`, { method: 'POST' });
            renderTechnologies(document.getElementById('content'));
        }

        async function renderProjects(container) {
            const res = await authenticatedFetch('/api/projects');
            const data = await res.json();
            const techRes = await authenticatedFetch('/api/technologies');
            const allTechs = await techRes.json();

            container.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Projects</h2>
                    <button onclick="showProjectModal()" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">+ Add New</button>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    ${data.map(proj => `
                        <div class="border rounded p-4 relative flex items-start space-x-4">
                             <div class="flex flex-col space-y-2 mt-1">
                                <div class="flex space-x-1">
                                    <button onclick="moveProject(${proj.id}, 'up')" class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">↑</button>
                                    <button onclick="moveProject(${proj.id}, 'down')" class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">↓</button>
                                </div>
                            </div>
                            <div class="flex-1">
                                <h3 class="text-lg font-bold">${proj.title} <span class="text-xs bg-gray-200 px-2 py-1 rounded ml-2">${proj.project_type}</span></h3>
                                <p class="text-gray-600 text-sm mb-2">${proj.description}</p>
                                <div class="text-sm mb-2">
                                    <strong>Tech:</strong> ${proj.tech_stack.map(t => t.technology).join(', ')}
                                </div>
                            </div>
                            <div class="flex flex-col space-y-1">
                                <button onclick='editProject(${JSON.stringify(proj).replace(/'/g, "&#39;")})' class="text-white bg-blue-600 hover:bg-blue-700 mb-3 px-2 py-1 rounded mr-2">Edit</button>
                                <button onclick="deleteProject(${proj.id})" class="text-white bg-red-600 hover:bg-red-700 px-2 py-1 rounded mr-2">Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>


                <!-- Modal for Add/Edit Project -->
                <div id="projectModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center overflow-y-auto">
                    <div class="bg-white p-6 rounded shadow-lg w-full max-w-lg m-4 max-h-screen overflow-y-auto">
                        <h3 id="projectModalTitle" class="text-lg font-bold mb-4">Add Project</h3>
                        <form id="projectForm">
                            <input type="hidden" name="id">
                            <div class="mb-2">
                                <label class="block text-sm font-medium">Title</label>
                                <input type="text" name="title" required class="w-full border p-2 rounded">
                            </div>
                            <div class="mb-2">
                                <label class="block text-sm font-medium">Type</label>
                                <select name="project_type" required class="w-full border p-2 rounded">
                                    <option value="Hobby">Hobby</option>
                                    <option value="Professional">Professional</option>
                                    <option value="Open Source">Open Source</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="block text-sm font-medium">Description</label>
                                <textarea name="description" required class="w-full border p-2 rounded"></textarea>
                            </div>
                            <div class="mb-2">
                                <label class="block text-sm font-medium">Links</label>
                                <input type="text" name="live_link" placeholder="Live Link" class="w-full border p-2 rounded mb-1">
                                <input type="text" name="github_link" placeholder="GitHub Link" class="w-full border p-2 rounded mb-1">
                                <!-- Change input type to file -->
                                <label class="block text-xs font-medium text-gray-500 mt-1">Cover Photo</label>
                                <input type="file" name="cover_photo_file" accept="image/*" class="w-full border p-2 rounded">
                                <!-- Hidden input to store URL if manually entered or returned from upload -->
                                <input type="text" name="cover_photo" placeholder="Or enter Image URL" class="w-full border p-2 rounded mt-1 text-sm">
                            </div>
                            <div class="mb-2">
                                <label class="block text-sm font-medium">Tech Stack</label>
                                <div class="h-48 overflow-y-auto border p-2 rounded grid grid-cols-2 gap-2 bg-gray-50">
                                    ${allTechs.map(t => `
                                        <label class="flex items-center space-x-2 cursor-pointer hover:bg-gray-100 p-1 rounded">
                                            <input type="checkbox" name="tech_stack_ids" value="${t.id}" class="form-checkbox h-4 w-4 text-blue-600">
                                            <span class="text-sm">${t.technology}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="flex justify-end space-x-2 mt-4">
                                <button type="button" onclick="document.getElementById('projectModal').classList.add('hidden')" class="px-4 py-2 border rounded">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('projectForm').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const id = formData.get('id');

                // Handle File Upload
                const fileInput = e.target.querySelector('input[name="cover_photo_file"]');
                let coverPhotoUrl = formData.get('cover_photo'); // Default to text input

                if (fileInput.files.length > 0) {
                    const uploadData = new FormData();
                    uploadData.append('file', fileInput.files[0]);

                    try {
                        const uploadRes = await authenticatedFetch('/api/upload', {
                            method: 'POST',
                            body: uploadData,
                        });
                        const uploadJson = await uploadRes.json();
                        coverPhotoUrl = uploadJson.url;
                    } catch (err) {
                        alert('Image upload failed');
                        console.error(err);
                        return; // Stop submission on upload fail
                    }
                }

                // Handle multiple select logic - CHECKBOXES now
                const techStackIds = Array.from(e.target.querySelectorAll('input[name="tech_stack_ids"]:checked')).map(cb => parseInt(cb.value));

                const payload = {
                    title: formData.get('title'),
                    project_type: formData.get('project_type'),
                    description: formData.get('description'),
                    live_link: formData.get('live_link'),
                    github_link: formData.get('github_link'),
                    cover_photo: coverPhotoUrl,
                    tech_stack_ids: techStackIds
                };

                const url = id ? `/api/projects/${id}` : '/api/projects';
                const method = id ? 'PUT' : 'POST';

                await authenticatedFetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('projectModal').classList.add('hidden');
                renderProjects(container);
            }
        }

        window.showProjectModal = () => {
            document.getElementById('projectModalTitle').innerText = "Add Project";
            document.getElementById('projectForm').reset();
            // Reset hidden id
            document.querySelector('#projectForm [name=id]').value = "";
            // Uncheck all boxes
            document.querySelectorAll('#projectForm input[name="tech_stack_ids"]').forEach(cb => cb.checked = false);
            document.getElementById('projectModal').classList.remove('hidden');
        };

        window.editProject = (proj) => {
            document.getElementById('projectModalTitle').innerText = "Edit Project";
            const form = document.getElementById('projectForm');
            form.reset();

            form.querySelector('[name=id]').value = proj.id;
            form.querySelector('[name=title]').value = proj.title;
            form.querySelector('[name=project_type]').value = proj.project_type;
            form.querySelector('[name=description]').value = proj.description;
            form.querySelector('[name=live_link]').value = proj.live_link || '';
            form.querySelector('[name=github_link]').value = proj.github_link || '';
            form.querySelector('[name=cover_photo]').value = proj.cover_photo || '';

            // Check checkboxes
            const techIds = proj.tech_stack.map(t => t.id);
            document.querySelectorAll('#projectForm input[name="tech_stack_ids"]').forEach(cb => {
                cb.checked = techIds.includes(parseInt(cb.value));
            });

            document.getElementById('projectModal').classList.remove('hidden');
        };

        window.deleteProject = async (id) => {
            if (!confirm('Are you sure?')) return;
            await authenticatedFetch(`/api/projects/${id}`, { method: 'DELETE' });
            renderProjects(document.getElementById('content'));
        }

        window.moveProject = async (id, direction) => {
            await authenticatedFetch(`/api/projects/${id}/move?direction=${direction}`, { method: 'POST' });
            renderProjects(document.getElementById('content'));
        }

        async function renderEducation(container) {
            const res = await authenticatedFetch('/api/edu');
            const data = await res.json();

            container.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Education</h2>
                    <button onclick="showEduModal()" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">+ Add New</button>
                </div>
                 <div class="grid grid-cols-1 gap-4">
                    ${data.map(item => `
                        <div class="border rounded p-4 relative flex items-start space-x-4">
                             <div class="flex flex-col space-y-2 mt-1">
                                <div class="flex space-x-1">
                                    <button onclick="moveEdu(${item.id}, 'up')" class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">↑</button>
                                    <button onclick="moveEdu(${item.id}, 'down')" class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">↓</button>
                                </div>
                            </div>
                            <div class="flex-1">
                                <h3 class="text-lg font-bold">${item.school}</h3>
                                <p class="text-gray-600 text-sm">${item.course} | ${item.start_date} - ${item.end_date}</p>
                                ${item.note ? `<p class="italic text-sm mt-2">${item.note}</p>` : ''}
                            </div>
                            <div class="flex flex-col space-y-1">
                                <button onclick='editEdu(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded mr-2">Edit</button>
                                <button onclick="deleteEdu(${item.id})" class="text-white bg-red-600 hover:bg-red-700 px-2 py-1 rounded mr-2">Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- Modal for Add/Edit Education -->
                <div id="eduModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center">
                    <div class="bg-white p-6 rounded shadow-lg w-96">
                        <h3 id="eduModalTitle" class="text-lg font-bold mb-4">Add Education</h3>
                        <form id="eduForm">
                            <input type="hidden" name="id">
                            <div class="mb-2"><label class="block text-sm">School/College</label><input type="text" name="school" required class="w-full border p-2 rounded"></div>
                            <div class="mb-2"><label class="block text-sm">Course</label><input type="text" name="course" required class="w-full border p-2 rounded"></div>
                            <div class="mb-2 grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-sm">Start Date</label>
                                    <input type="text" name="start_date" placeholder="e.g. Sep 2020" required class="w-full border p-2 rounded">
                                </div>
                                <div>
                                    <label class="block text-sm">End Date</label>
                                    <input type="text" name="end_date" placeholder="e.g. Present" required class="w-full border p-2 rounded">
                                </div>
                            </div>
                            <div class="mb-4"><label class="block text-sm">Note (Optional)</label><textarea name="note" class="w-full border p-2 rounded"></textarea></div>
                            <div class="flex justify-end space-x-2">
                                <button type="button" onclick="document.getElementById('eduModal').classList.add('hidden')" class="px-4 py-2 border rounded">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('eduForm').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const payload = Object.fromEntries(formData.entries());
                const id = formData.get('id');

                const url = id ? `/api/edu/${id}` : '/api/edu';
                const method = id ? 'PUT' : 'POST';

                await authenticatedFetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('eduModal').classList.add('hidden');
                renderEducation(container);
            }
        }

        window.showEduModal = () => {
            document.getElementById('eduModalTitle').innerText = "Add Education";
            document.getElementById('eduForm').reset();
            document.querySelector('#eduForm [name=id]').value = "";
            document.getElementById('eduModal').classList.remove('hidden');
        };

        window.editEdu = (item) => {
            document.getElementById('eduModalTitle').innerText = "Edit Education";
            const form = document.getElementById('eduForm');
            form.querySelector('[name=id]').value = item.id;
            form.querySelector('[name=school]').value = item.school;
            form.querySelector('[name=course]').value = item.course;
            form.querySelector('[name=start_date]').value = item.start_date;
            form.querySelector('[name=end_date]').value = item.end_date;
            form.querySelector('[name=note]').value = item.note || '';
            document.getElementById('eduModal').classList.remove('hidden');
        };

        window.deleteEdu = async (id) => {
            if (!confirm('Are you sure?')) return;
            await authenticatedFetch(`/api/edu/${id}`, { method: 'DELETE' });
            renderEducation(document.getElementById('content'));
        }

        window.moveEdu = async (id, direction) => {
            await authenticatedFetch(`/api/edu/${id}/move?direction=${direction}`, { method: 'POST' });
            renderEducation(document.getElementById('content'));
        }

        async function renderContacts(container) {
            const res = await authenticatedFetch('/api/contact');
            const data = await res.json();

            container.innerHTML = `
                <h2 class="text-2xl font-bold mb-4">Contact Messages</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${data.map(msg => `
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(msg.date_time).toLocaleDateString()}</td>
                                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${msg.name}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${msg.email}</td>
                                    <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate" title="${msg.message}">${msg.message}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <button onclick="deleteContact(${msg.id})" class="text-red-600 hover:text-red-900">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
             `;
        }
        window.deleteContact = async (id) => {
            if (!confirm('Are you sure?')) return;
            await authenticatedFetch(`/api/contact/${id}`, { method: 'DELETE' });
            renderContacts(document.getElementById('content'));
        }

        // --- Init ---
        if (token) {
            renderDashboard();
        } else {
            renderLogin();
        }
    </script>
</body>

</html>
